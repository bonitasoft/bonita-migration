###
### Configuration file for the update
### Each of these properties can be overridden using system properties in `bonita-update` script (e.g. -Ddb.vendor=mysql)
###

# the database vendor, can be 'postgres', 'mysql', 'oracle' or 'sqlserver'
db.vendor=postgres

# URL OF THE DATABASE TO UPDATE:
# mysql:
#db.url=jdbc:mysql://localhost:3306/bonita?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8
# oracle:
#db.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1.localdomain?oracle.net.disableOob=true
# sqlserver:
#db.url=jdbc:sqlserver://localhost:1433;database=bonita
db.url=jdbc:postgresql://localhost:5432/bonita

# CLASS OF THE DATABASE DRIVER TO USE (the jar of the driver must be put in the lib folder)
# mysql:
#db.driverClass=com.mysql.cj.jdbc.Driver
# oracle:
#db.driverClass=oracle.jdbc.OracleDriver
# sqlserver:
#db.driverClass=com.microsoft.sqlserver.jdbc.SQLServerDriver
db.driverClass=org.postgresql.Driver

# USER OF THE DATABASE TO USE
db.user=bonita

# PASSWORD OF THE USER
db.password=bpm

# DATABASE CONNECTION POOL SETTINGS
db.pool.size.initial=3
db.pool.size.max=10

# information level when running update (ERROR, WARN, INFO, DEBUG)
logger.level=INFO

# The version to which bonita must be updated to. If not set, you will be asked in the console.
# After 7.11.0 there is no update needed for maintenance releases so only updates to 7.X**.0** are available for X >= 11, i.e. enter 7.11.0 to update to 7.11.5
#target.version=7.x.y
